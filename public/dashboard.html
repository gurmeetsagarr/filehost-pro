<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FileHost Pro — Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; background: #060610; color: #e2e8f0; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="border-b border-indigo-900/30 bg-slate-900/60 backdrop-blur-md px-6 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-gradient-to-tr from-indigo-600 to-purple-600 rounded-xl flex items-center justify-center font-bold text-lg text-white">⬡</div>
      <div>
        <h1 class="font-bold text-lg text-white">FileHost Pro</h1>
        <p class="text-xs text-indigo-400 font-mono">Admin: gurmeet</p>
      </div>
    </div>
    <div class="flex items-center gap-4">
      <div class="text-xs font-mono bg-indigo-950/60 border border-indigo-800/40 px-3 py-1.5 rounded-lg text-indigo-300">
        Session Active: <span id="timerVal">00:00:00</span>
      </div>
      <button id="logoutBtn" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 text-xs px-4 py-2 rounded-lg font-medium transition">Logout</button>
    </div>
  </header>

  <main class="flex-1 p-6 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
    <div class="lg:col-span-2 space-y-6">
      <div class="bg-slate-900/70 border border-indigo-900/40 rounded-2xl p-6 backdrop-blur-md shadow-xl">
        <h2 class="text-base font-semibold text-white mb-4">Universal File Upload</h2>
        <div id="dropZone" class="border-2 border-dashed border-indigo-500/30 hover:border-indigo-500/60 rounded-xl p-8 text-center cursor-pointer transition bg-indigo-950/20">
          <p class="text-sm font-medium text-slate-200">Drag & drop any file here, or <span class="text-indigo-400 underline">browse</span></p>
          <p class="text-xs text-slate-500 mt-1">Supports Python, Java, JS, HTML, Archives, and all file formats</p>
          <input type="file" id="fileInput" class="hidden">
        </div>
        <div id="uploadProgress" class="mt-4 hidden">
          <div class="flex justify-between text-xs text-slate-400 mb-1">
            <span id="uploadFileName">Uploading...</span>
            <span id="uploadPercent">0%</span>
          </div>
          <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
            <div id="progressBar" class="bg-indigo-500 h-full w-0 transition-all duration-200"></div>
          </div>
        </div>
      </div>

      <div class="bg-slate-900/70 border border-indigo-900/40 rounded-2xl p-6 backdrop-blur-md shadow-xl">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-base font-semibold text-white">Hosted Files & Management</h2>
          <button id="refreshFiles" class="text-xs text-indigo-400 hover:underline">Refresh List</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead>
              <tr class="border-b border-slate-800 text-slate-400 font-mono">
                <th class="pb-3">FILE NAME</th>
                <th class="pb-3">SIZE</th>
                <th class="pb-3">UPLOADED AT</th>
                <th class="pb-3 text-right">ACTIONS</th>
              </tr>
            </thead>
            <tbody id="filesTableBody" class="divide-y divide-slate-800/60"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="bg-slate-950 border border-indigo-900/40 rounded-2xl p-4 flex flex-col shadow-xl font-mono">
      <div class="flex justify-between items-center pb-3 border-b border-slate-800 mb-3">
        <div class="flex items-center gap-2">
          <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
          <span class="text-xs font-semibold text-slate-300">Live Server Terminal</span>
        </div>
        <button id="clearTerminal" class="text-[10px] text-slate-500 hover:text-slate-300">Clear</button>
      </div>
      <div id="terminalLogs" class="flex-1 overflow-y-auto space-y-2 text-[11px] pr-2 max-h-[500px] select-text"></div>
    </div>
  </main>

  <script>
    let seconds = 0;
    setInterval(() => {
      seconds++;
      const hrs = String(Math.floor(seconds / 3600)).padStart(2, '0');
      const mins = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
      const secs = String(seconds % 60).padStart(2, '0');
      document.getElementById('timerVal').textContent = `${hrs}:${mins}:${secs}`;
    }, 1000);

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/';
    });

    const socket = io();
    const terminalLogs = document.getElementById('terminalLogs');

    socket.on('terminal-log', (data) => {
      const div = document.createElement('div');
      div.className = 'flex items-start gap-2 leading-relaxed';
      let colorClass = 'text-slate-300';
      if (data.type === 'success') colorClass = 'text-emerald-400';
      if (data.type === 'error') colorClass = 'text-rose-400';
      if (data.type === 'warning') colorClass = 'text-amber-400';
      div.innerHTML = `<span class="text-slate-500 shrink-0">[${data.timestamp}]</span> <span class="${colorClass}">${data.message}</span>`;
      terminalLogs.appendChild(div);
      terminalLogs.scrollTop = terminalLogs.scrollHeight;
    });

    document.getElementById('clearTerminal').addEventListener('click', () => { terminalLogs.innerHTML = ''; });

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer.files.length) uploadFile(e.dataTransfer.files[0]); });
    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    fileInput.addEventListener('change', () => { if (fileInput.files.length) uploadFile(fileInput.files[0]); });

    async function uploadFile(file) {
      const formData = new FormData();
      formData.append('file', file);
      const progressContainer = document.getElementById('uploadProgress');
      const progressBar = document.getElementById('progressBar');
      const uploadPercent = document.getElementById('uploadPercent');
      document.getElementById('uploadFileName').textContent = file.name;
      progressContainer.classList.remove('hidden');

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();
        progressBar.style.width = '100%';
        uploadPercent.textContent = '100%';
        setTimeout(() => progressContainer.classList.add('hidden'), 1500);
        if (data.success) loadFiles();
        else alert(data.error || 'Upload failed');
      } catch (err) {
        alert('Network error during upload.');
        progressContainer.classList.add('hidden');
      }
    }

    async function loadFiles() {
      try {
        const res = await fetch('/api/files');
        const data = await res.json();
        if (data.success) {
          const tbody = document.getElementById('filesTableBody');
          tbody.innerHTML = '';
          if (data.files.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-500">No files hosted yet.</td></tr>`;
            return;
          }
          data.files.forEach(f => {
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-800/40 transition';
            tr.innerHTML = `
              <td class="py-3 font-medium text-slate-200">${f.originalName}</td>
              <td class="py-3 text-slate-400 font-mono">${(f.size / 1024).toFixed(2)} KB</td>
              <td class="py-3 text-slate-500 font-mono">${new Date(f.createdAt).toLocaleString()}</td>
              <td class="py-3 text-right space-x-2">
                <a href="/api/download/${f.filename}" class="text-indigo-400 hover:underline font-medium">Download</a>
                <button onclick="deleteFile('${f.filename}')" class="text-rose-400 hover:underline font-medium">Delete</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }
      } catch (err) { console.error('Failed to load files'); }
    }

    async function deleteFile(filename) {
      if (confirm('Are you sure you want to delete this file?')) {
        const res = await fetch(`/api/delete/${filename}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) loadFiles();
        else alert(data.error || 'Failed to delete');
      }
    }

    document.getElementById('refreshFiles').addEventListener('click', loadFiles);
    loadFiles();
  </script>
</body>
</html>
