<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FileHost Pro — Auth</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; background: #060610; color: #e2e8f0; }</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-slate-900/80 border border-indigo-900/40 rounded-2xl p-8 w-full max-w-md backdrop-blur-xl shadow-2xl">
    <div class="text-center mb-6">
      <div class="w-12 h-12 bg-gradient-to-tr from-indigo-600 to-purple-600 rounded-xl mx-auto flex items-center justify-center text-xl font-bold text-white mb-2">⬡</div>
      <h1 class="text-xl font-bold text-white">FileHost Pro Matrix</h1>
      <p class="text-xs text-slate-400">Sign in or create account</p>
    </div>

    <div class="flex bg-slate-950 p-1 rounded-xl mb-6 text-xs font-medium">
      <button onclick="switchTab('login')" id="loginTabBtn" class="flex-1 py-2 rounded-lg bg-indigo-600 text-white transition">Sign In</button>
      <button onclick="switchTab('signup')" id="signupTabBtn" class="flex-1 py-2 rounded-lg text-slate-400 transition">Sign Up</button>
    </div>

    <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs font-medium"></div>

    <!-- Login Form -->
    <form id="authForm" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">USERNAME</label>
        <input type="text" id="username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-indigo-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">PASSWORD</label>
        <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-indigo-500 outline-none">
      </div>
      <button type="submit" id="submitBtn" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl text-white font-semibold text-sm shadow-lg hover:opacity-90 transition">Sign In</button>
    </form>
  </div>

  <script>
    let isLogin = true;
    function switchTab(tab) {
      isLogin = (tab === 'login');
      document.getElementById('loginTabBtn').className = isLogin ? 'flex-1 py-2 rounded-lg bg-indigo-600 text-white transition' : 'flex-1 py-2 rounded-lg text-slate-400 transition';
      document.getElementById('signupTabBtn').className = !isLogin ? 'flex-1 py-2 rounded-lg bg-indigo-600 text-white transition' : 'flex-1 py-2 rounded-lg text-slate-400 transition';
      document.getElementById('submitBtn').textContent = isLogin ? 'Sign In' : 'Create Account';
    }

    document.getElementById('authForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const endpoint = isLogin ? '/api/auth/login' : '/api/auth/signup';

      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      const alertBox = document.getElementById('alertBox');
      alertBox.classList.remove('hidden');

      if (data.success) {
        if (isLogin) {
          window.location.href = '/dashboard';
        } else {
          alertBox.className = 'mb-4 p-3 rounded-lg text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
          alertBox.textContent = 'Account created successfully! Now sign in.';
          switchTab('login');
        }
      } else {
        alertBox.className = 'mb-4 p-3 rounded-lg text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20';
        alertBox.textContent = data.error || 'Authentication failed';
      }
    });
  </script>
</body>
</html>
