<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard — FileHost Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>body { font-family: 'Inter', sans-serif; background: #060610; color: #e2e8f0; }</style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="border-b border-indigo-900/30 bg-slate-900/60 px-6 py-4 flex justify-between items-center">
    <h1 class="font-bold text-white text-base">User Hosting Portal</h1>
    <button onclick="logout()" class="text-xs bg-rose-500/10 text-rose-400 px-3 py-1.5 rounded-lg border border-rose-500/20">Logout</button>
  </header>

  <main class="flex-1 p-6 max-w-5xl mx-auto w-full grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="space-y-6">
      <div class="bg-slate-900/70 border border-indigo-900/40 rounded-2xl p-6">
        <h2 class="text-sm font-semibold text-white mb-3">Upload & Host File</h2>
        <input type="file" id="fileInput" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-xs text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:bg-indigo-600 file:text-white cursor-pointer">
        <button onclick="uploadFile()" class="mt-3 w-full py-2.5 bg-indigo-600 rounded-xl text-xs font-semibold text-white">Upload File</button>
      </div>

      <div class="bg-slate-900/70 border border-indigo-900/40 rounded-2xl p-6">
        <h2 class="text-sm font-semibold text-white mb-3">Your Hosted Files</h2>
        <div id="fileList" class="space-y-2 text-xs"></div>
      </div>
    </div>

    <div class="bg-slate-950 border border-indigo-900/40 rounded-2xl p-4 font-mono text-[11px] flex flex-col h-[400px]">
      <div class="text-slate-400 pb-2 border-b border-slate-800 mb-2">Live Terminal</div>
      <div id="terminal" class="flex-1 overflow-y-auto space-y-1"></div>
    </div>
  </main>

  <script>
    async function logout() { await fetch('/api/auth/logout', { method: 'POST' }); window.location.href = '/'; }

    async function uploadFile() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) return alert('Select a file first!');
      const formData = new FormData();
      formData.append('file', file);
      const res = await fetch('/api/upload', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.success) { alert('Uploaded successfully!'); loadFiles(); }
    }

    async function loadFiles() {
      const res = await fetch('/api/files');
      const data = await res.json();
      const div = document.getElementById('fileList');
      div.innerHTML = '';
      if (!data.files || data.files.length === 0) { div.innerHTML = '<span class="text-slate-500">No files uploaded.</span>'; return; }
      data.files.forEach(f => {
        div.innerHTML += `<div class="flex justify-between items-center bg-slate-950 p-3 rounded-xl border border-slate-800">
          <span>${f.originalname}</span>
          <a href="/api/download/${f.filename}" class="text-indigo-400 font-medium">Download</a>
        </div>`;
      });
    }

    const socket = io();
    socket.on('terminal-log', (d) => {
      const term = document.getElementById('terminal');
      term.innerHTML += `<div>[${d.timestamp}] ${d.message}</div>`;
      term.scrollTop = term.scrollHeight;
    });

    loadFiles();
  </script>
</body>
</html>
